<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 48px;
      height: 316px;
      overflow: hidden;
      background: transparent;
    }

    /* ── HUB handle (top) ── */
    .handle {
      width: 48px;
      height: 96px;
      background: linear-gradient(160deg, #1c1c35 0%, #141428 100%);
      border: 1px solid rgba(99, 102, 241, 0.38);
      border-right: none;
      border-radius: 12px 0 0 0;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.6), inset 1px 0 0 rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      user-select: none;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .handle:hover {
      background: linear-gradient(160deg, #222244 0%, #1a1a38 100%);
      box-shadow: -4px 0 24px rgba(99, 102, 241, 0.25), inset 1px 0 0 rgba(255,255,255,0.06);
    }
    .handle:active { background: linear-gradient(160deg, #181830 0%, #111122 100%); }

    .icon { color: #6366f1; flex-shrink: 0; transition: color 0.15s; }
    .handle:hover .icon { color: #818cf8; }

    .label {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 8px; font-weight: 700; letter-spacing: 2px;
      color: #4f4f8f;
      writing-mode: vertical-rl; text-orientation: mixed;
      transition: color 0.15s;
    }
    .handle:hover .label { color: #6366f1; }

    .focus-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2e2e44; flex-shrink: 0;
      transition: background 0.4s, box-shadow 0.4s;
    }
    .focus-dot.active {
      background: #22c55e;
      box-shadow: 0 0 7px rgba(34, 197, 94, 0.8);
    }

    /* ── Jiggler button ── */
    .jig-btn {
      width: 48px;
      height: 44px;
      margin-top: 6px;
      background: linear-gradient(160deg, #1c1c35 0%, #141428 100%);
      border: 1px solid rgba(99, 102, 241, 0.28);
      border-right: none;
      border-radius: 8px 0 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      user-select: none;
      transition: background 0.15s;
    }
    .jig-btn:hover { background: linear-gradient(160deg, #222244 0%, #1a1a38 100%); }
    .jig-btn:active { background: linear-gradient(160deg, #181830 0%, #111122 100%); }

    .jig-icon {
      color: #4f4f8f;
      transition: color 0.15s, filter 0.15s;
      flex-shrink: 0;
    }
    .jig-btn:hover .jig-icon { color: #6366f1; }
    .jig-btn.active .jig-icon {
      color: #f59e0b;
      filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.75));
    }

    /* ── Calendar strip (bottom) ── */
    .cal-strip {
      width: 48px;
      height: 164px;
      margin-top: 6px;
      background: linear-gradient(160deg, #131325 0%, #0e0e20 100%);
      border: 1px solid rgba(99, 102, 241, 0.22);
      border-right: none;
      border-top: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 0 0 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 10px;
      gap: 6px;
      overflow: hidden;
      cursor: pointer;
      -webkit-app-region: no-drag;
      user-select: none;
    }
    .cal-strip:hover { background: linear-gradient(160deg, #181832 0%, #121228 100%); }

    .cal-strip-label {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 7px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: #3a3a6a;
      writing-mode: vertical-rl; text-orientation: mixed;
      flex: none;
    }

    .cal-divider {
      width: 24px; height: 1px;
      background: rgba(99, 102, 241, 0.18);
      flex: none;
    }

    .cal-items { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; overflow: hidden; }

    .cal-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; width: 100%; cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.12s;
    }
    .cal-item:hover { background: rgba(99,102,241,0.12); }

    .cal-item-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .cal-item-dot.now  { background: #6366f1; box-shadow: 0 0 6px rgba(99,102,241,.8); animation: pulse-cal 1.4s ease-in-out infinite; }
    .cal-item-dot.soon { background: #f59e0b; }
    .cal-item-dot.later { background: #3a3a5a; }

    @keyframes pulse-cal { 0%,100%{opacity:1} 50%{opacity:.35} }

    .cal-item-time {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 9px; font-weight: 700; color: #6366f1;
      writing-mode: vertical-rl; text-orientation: mixed;
      letter-spacing: .03em; line-height: 1;
    }
    .cal-item-time.muted { color: #4a4a6a; }
    .cal-item-time.now   { color: #818cf8; }

    .cal-empty-msg {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 8px; color: #2e2e4e; font-weight: 600; letter-spacing: .06em;
      writing-mode: vertical-rl; text-orientation: mixed;
    }
  </style>
</head>
<body>
  <div class="handle" id="handle" title="My Working Hub — click to open">
    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    <span class="label">HUB</span>
    <span class="focus-dot" id="focus-dot"></span>
  </div>

  <div class="jig-btn" id="jig-btn" title="Mouse Jiggler — keep screen awake">
    <svg class="jig-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="2" width="12" height="18" rx="6"/>
      <line x1="12" y1="7" x2="12" y2="11"/>
    </svg>
  </div>

  <div class="cal-strip" id="cal-strip" title="Calendar — click to open">
    <span class="cal-strip-label">CAL</span>
    <div class="cal-divider"></div>
    <div class="cal-items" id="cal-items">
      <span class="cal-empty-msg">–</span>
    </div>
  </div>

  <script>
    const PORT = 8765;

    document.getElementById('handle').addEventListener('click', () => {
      window.electronAPI.toggle();
    });

    document.getElementById('cal-strip').addEventListener('click', () => {
      window.electronAPI.openPage('calendar');
    });

    // ── Jiggler ──
    const jigBtn = document.getElementById('jig-btn');
    let jigActive = false;

    function setJigState(active) {
      jigActive = active;
      jigBtn.classList.toggle('active', active);
      jigBtn.title = active ? 'Mouse Jiggler — active (click to stop)' : 'Mouse Jiggler — keep screen awake';
    }

    jigBtn.addEventListener('click', async () => {
      try {
        const endpoint = jigActive ? 'stop' : 'start';
        await fetch(`http://127.0.0.1:${PORT}/api/jiggler/${endpoint}`, { method: 'POST' });
        setJigState(!jigActive);
      } catch {}
    });

    // Poll status so auto-stop (from keyboard/mouse) reflects in the button
    setInterval(async () => {
      if (!jigActive) return;
      try {
        const res = await fetch(`http://127.0.0.1:${PORT}/api/jiggler/status`);
        const data = await res.json();
        if (!data.running) setJigState(false);
      } catch {}
    }, 5000);

    async function syncJiggler() {
      try {
        const res = await fetch(`http://127.0.0.1:${PORT}/api/jiggler/status`);
        const data = await res.json();
        setJigState(data.running);
      } catch {}
    }
    setTimeout(syncJiggler, 2500);

    const focusDot = document.getElementById('focus-dot');

    window.electronAPI.onFocusState((active) => {
      focusDot.classList.toggle('active', active);
    });

    // Fallback: poll the server directly so the dot is always correct
    // even if the IPC message was missed on startup.
    async function syncFocusDot() {
      try {
        const res = await fetch(`http://127.0.0.1:${PORT}/api/work-sessions/current`);
        const sess = await res.json();
        focusDot.classList.toggle('active', sess !== null);
      } catch {}
    }
    setTimeout(syncFocusDot, 2500);
    setInterval(syncFocusDot, 30_000);

    function fmtTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function renderEvents(events) {
      const container = document.getElementById('cal-items');
      const now = new Date();

      // Keep only events not more than 10 min in the past, max 3
      const relevant = events
        .filter(ev => new Date(ev.end) > new Date(now - 10 * 60 * 1000))
        .slice(0, 3);

      if (!relevant.length) {
        container.innerHTML = '<span class="cal-empty-msg">clear</span>';
        return;
      }

      container.innerHTML = '';
      relevant.forEach(ev => {
        const start = new Date(ev.start);
        const end   = new Date(ev.end);
        const isNow  = now >= start && now < end;
        const isSoon = !isNow && (start - now) < 30 * 60 * 1000 && start > now;

        const item = document.createElement('div');
        item.className = 'cal-item';
        item.title = ev.subject;

        const dot = document.createElement('span');
        dot.className = 'cal-item-dot ' + (isNow ? 'now' : isSoon ? 'soon' : 'later');

        const time = document.createElement('span');
        time.className = 'cal-item-time ' + (isNow ? 'now' : isSoon ? '' : 'muted');
        time.textContent = isNow ? 'NOW' : fmtTime(ev.start);

        item.appendChild(dot);
        item.appendChild(time);
        container.appendChild(item);
      });
    }

    async function fetchEvents() {
      try {
        const res  = await fetch(`http://127.0.0.1:${PORT}/api/calendar/events?days=0`);
        const data = await res.json();
        if (data.ok) renderEvents(data.events || []);
      } catch {
        // server not ready yet — silently ignore
      }
    }

    // First fetch after server warmup, then every minute to keep NOW/SOON state fresh
    setTimeout(fetchEvents, 3000);
    setInterval(fetchEvents, 60 * 1000);
  </script>
</body>
</html>
