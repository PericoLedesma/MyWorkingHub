<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 48px;
      height: 260px;
      overflow: hidden;
      background: transparent;
    }

    :root {
      --indigo:      #6366f1;
      --indigo-lt:   #818cf8;
      --indigo-faint: rgba(99,102,241,.15);
      --border:      rgba(99,102,241,.30);
      --divider:     rgba(99,102,241,.11);
      --bg:          #111126;
      --bg-deep:     #0b0b1a;
      --text-dim:    #484870;
      --text-muted:  #30304e;
      --green:       #22c55e;
      --amber:       #f59e0b;
      --red:         #ef4444;
    }

    /* ── Single outer shell ── */
    .shell {
      width: 48px;
      height: 260px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 14px 0 0 14px;
      overflow: hidden;
      box-shadow: -4px 0 28px rgba(0,0,0,.6), inset 1px 0 0 rgba(255,255,255,.03);
    }

    .divider {
      width: 100%; height: 1px;
      background: var(--divider);
      flex-shrink: 0;
    }

    /* ── Shared section base ── */
    .sec {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-shrink: 0;
      cursor: pointer;
      -webkit-app-region: no-drag;
      user-select: none;
      transition: background 0.14s;
    }
    .sec:hover  { background: rgba(99,102,241,.07); }
    .sec:active { background: rgba(99,102,241,.03); }

    /* ── HUB (86 px) ── */
    .hub { height: 86px; }

    .hub-icon { color: var(--indigo); transition: color .15s; }
    .hub:hover .hub-icon { color: var(--indigo-lt); }

    .hub-label {
      font: 700 7px/1 'Segoe UI', system-ui, sans-serif;
      letter-spacing: 3.5px; text-transform: uppercase;
      color: var(--text-dim);
      transition: color .15s;
    }
    .hub:hover .hub-label { color: var(--indigo); }

    .focus-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #222240;
      transition: background .4s, box-shadow .4s;
    }
    .focus-dot.active {
      background: var(--green);
      box-shadow: 0 0 7px rgba(34,197,94,.75);
    }

    /* ── REC (60 px) ── */
    .rec { height: 60px; }
    .rec.on { background: rgba(239,68,68,.05); }
    .rec.on:hover { background: rgba(239,68,68,.09); }

    .rec-dot {
      width: 13px; height: 13px; border-radius: 50%;
      background: #28184a;
      transition: background .3s, box-shadow .3s;
    }
    .rec.on .rec-dot {
      background: var(--red);
      box-shadow: 0 0 10px rgba(239,68,68,.72);
      animation: blink 1.15s ease-in-out infinite;
    }

    .rec-label {
      font: 700 8.5px/1 'Segoe UI', system-ui, sans-serif;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-muted);
      transition: color .3s;
    }
    .rec.on .rec-label { color: #f87171; letter-spacing: .5px; }

    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.78)} }

    /* ── Jiggler (48 px) ── */
    .jig { height: 48px; }

    .jig-icon { color: var(--text-dim); transition: color .15s, filter .15s; }
    .jig:hover .jig-icon { color: var(--indigo); }
    .jig.on .jig-icon {
      color: var(--amber);
      filter: drop-shadow(0 0 5px rgba(245,158,11,.72));
    }

    /* ── Focus Time (58 px) ── */
    .ft { height: 58px; }
    .ft.on { background: rgba(34,197,94,.04); }

    .ft-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #222240;
      transition: background .4s, box-shadow .4s;
    }
    .ft-dot.on {
      background: var(--green);
      box-shadow: 0 0 6px rgba(34,197,94,.72);
      animation: breathe 1.5s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.4} }

    .ft-label {
      font: 700 9px/1 'Segoe UI', system-ui, sans-serif;
      letter-spacing: .04em;
      color: var(--text-dim);
      transition: color .4s;
    }
    .ft.on .ft-label { color: #4ade80; }

  </style>
</head>
<body>
  <div class="shell">

    <!-- HUB -->
    <div class="sec hub" id="handle" title="My Working Hub — click to open">
      <svg class="hub-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="hub-label">HUB</span>
      <span class="focus-dot" id="focus-dot"></span>
    </div>

    <div class="divider"></div>

    <!-- REC -->
    <div class="sec rec" id="rec-btn" title="Start recording">
      <span class="rec-dot"></span>
      <span class="rec-label" id="rec-label">REC</span>
    </div>

    <div class="divider"></div>

    <!-- Jiggler -->
    <div class="sec jig" id="jig-btn" title="Mouse Jiggler — keep screen awake">
      <svg class="jig-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="2" width="12" height="18" rx="6"/>
        <line x1="12" y1="7" x2="12" y2="11"/>
      </svg>
    </div>

    <div class="divider"></div>

    <!-- Focus Time -->
    <div class="sec ft" id="ft-strip" title="Focus Time today — click to open">
      <span class="ft-dot" id="ft-dot"></span>
      <span class="ft-label" id="ft-time">–</span>
    </div>

  </div>

  <script>
    const PORT = 8765;

    // ── HUB ──
    document.getElementById('handle').addEventListener('click', () => window.electronAPI.toggle());

    // ── Recording ──
    const recBtn   = document.getElementById('rec-btn');
    const recLabel = document.getElementById('rec-label');
    let recActive = false;
    let recStart  = null;
    let recTimer  = null;

    function setRecState(active, startTime) {
      recActive = active;
      recStart  = startTime ? new Date(startTime) : null;
      recBtn.classList.toggle('on', active);
      recBtn.title = active ? 'Recording… click to stop' : 'Start recording';
      clearInterval(recTimer);
      recTimer = null;
      if (!active) {
        recLabel.textContent = 'REC';
      } else {
        recTimer = setInterval(tickRec, 1000);
        tickRec();
      }
    }

    function tickRec() {
      if (!recStart) return;
      const s = Math.floor((Date.now() - recStart.getTime()) / 1000);
      const m = Math.floor(s / 60);
      recLabel.textContent = m > 0 ? `${m}:${String(s % 60).padStart(2, '0')}` : `${s}s`;
    }

    recBtn.addEventListener('click', async () => {
      try {
        if (recActive) {
          await fetch(`http://127.0.0.1:${PORT}/api/record/stop`, { method: 'POST' });
          setRecState(false);
        } else {
          const res = await fetch(`http://127.0.0.1:${PORT}/api/record/start`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ source: 'both', device_index: null }),
          });
          if (res.ok) setRecState(true, new Date().toISOString());
        }
      } catch {}
    });

    async function syncRec() {
      try {
        const res  = await fetch(`http://127.0.0.1:${PORT}/api/recording/status`);
        const data = await res.json();
        setRecState(data.recording, data.recording_start);
      } catch {
        setRecState(false);
      }
    }
    setTimeout(syncRec, 2500);
    setInterval(syncRec, 15_000);

    // ── Jiggler ──
    const jigBtn = document.getElementById('jig-btn');
    let jigOn = false;

    function setJigState(on) {
      jigOn = on;
      jigBtn.classList.toggle('on', on);
      jigBtn.title = on ? 'Jiggler active — click to stop' : 'Mouse Jiggler — keep screen awake';
    }

    jigBtn.addEventListener('click', async () => {
      try {
        await fetch(`http://127.0.0.1:${PORT}/api/jiggler/${jigOn ? 'stop' : 'start'}`, { method: 'POST' });
        setJigState(!jigOn);
      } catch {}
    });

    setInterval(async () => {
      if (!jigOn) return;
      try {
        const d = await (await fetch(`http://127.0.0.1:${PORT}/api/jiggler/status`)).json();
        if (!d.running) setJigState(false);
      } catch {}
    }, 5000);

    setTimeout(async () => {
      try {
        const d = await (await fetch(`http://127.0.0.1:${PORT}/api/jiggler/status`)).json();
        setJigState(d.running);
      } catch {}
    }, 2500);

    // ── Focus dot (IPC) ──
    const focusDot = document.getElementById('focus-dot');
    window.electronAPI.onFocusState((active) => {
      focusDot.classList.toggle('active', active);
      syncFT();
    });

    setTimeout(async () => {
      try {
        const s = await (await fetch(`http://127.0.0.1:${PORT}/api/work-sessions/current`)).json();
        focusDot.classList.toggle('active', s !== null);
      } catch {
        focusDot.classList.remove('active');
      }
    }, 2500);
    setInterval(async () => {
      try {
        const s = await (await fetch(`http://127.0.0.1:${PORT}/api/work-sessions/current`)).json();
        focusDot.classList.toggle('active', s !== null);
      } catch {
        focusDot.classList.remove('active');
      }
    }, 30_000);

    // ── Focus Time strip ──
    document.getElementById('ft-strip').addEventListener('click', () => window.electronAPI.openPage('focustime'));

    function fmtFocus(s) {
      if (s < 60) return '<1m';
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      return h ? `${h}h${m ? m + 'm' : ''}` : `${m}m`;
    }

    async function syncFT() {
      const strip = document.getElementById('ft-strip');
      const dot   = document.getElementById('ft-dot');
      const lbl   = document.getElementById('ft-time');
      try {
        const today = new Date().toISOString().slice(0, 10);
        const [sR, cR] = await Promise.all([
          fetch(`http://127.0.0.1:${PORT}/api/work-sessions?date=${today}`),
          fetch(`http://127.0.0.1:${PORT}/api/work-sessions/current`),
        ]);
        const sessions = await sR.json();
        const cur      = await cR.json();
        const doneSecs = sessions.filter(s => s.duration_seconds != null)
                                 .reduce((a, s) => a + s.duration_seconds, 0);
        const activeMs   = cur?.start_time ? new Date(cur.start_time).getTime() : null;
        const activeSecs = activeMs ? Math.floor((Date.now() - activeMs) / 1000) : 0;
        const total      = doneSecs + activeSecs;
        const isOn       = activeMs !== null;
        strip.classList.toggle('on', isOn);
        dot.classList.toggle('on', isOn);
        lbl.textContent = total > 0 ? fmtFocus(total) : '–';
      } catch {
        strip.classList.remove('on');
        dot.classList.remove('on');
        lbl.textContent = '–';
        focusDot.classList.remove('active');
      }
    }
    setTimeout(syncFT, 3000);
    setInterval(syncFT, 30_000);

  </script>
</body>
</html>
